<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIFilipe - Chat</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --chat-bg: #ffffff;
            --primary-color: #007bff;
            --text-color: #333333;
            --border-color: #dddddd;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 500px;
            height: 80vh;
            background: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: var(--primary-color);
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.2rem;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            background: #fafafa;
        }

        .chat-footer {
            padding: 10px;
            border-top: 1px solid var(--border-color);
            background: white;
        }

        .input-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
            background: #f0f2f5;
            border-radius: 24px;
            padding: 5px 12px;
        }

        .chat-input {
            flex: 1;
            border: none;
            background: transparent;
            padding: 8px;
            font-size: 1rem;
            outline: none;
        }

        .btn-action {
            background: transparent;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }

        .btn-action:active {
            transform: scale(0.9);
        }

        .btn-send {
            color: var(--primary-color);
            font-weight: bold;
            font-size: 1rem;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <!-- Cabeçalho -->
        <div class="chat-header">
            <span>AIFilipe</span>
            <span>🔄</span>
        </div>

        <!-- Área de Mensagens -->
        <div class="chat-messages" id="chatMessages">
            <!-- As mensagens do chat vão aparecer aqui -->
        </div>

        <!-- Rodapé de Input -->
        <div class="chat-footer">
            <div class="input-wrapper">
                <button class="btn-action" title="Anexar ficheiro">📁</button>
                
                <input type="text" id="userInput" class="chat-input" placeholder="Escreva um comando ao AIFilipe...">
                
                <button class="btn-action btn-send" id="sendBtn">Enviar</button>
            </div>
        </div>
    </div>

    <script>
        // Lógica básica de envio para interação imediata
        const sendBtn = document.getElementById('sendBtn');
        const userInput = document.getElementById('userInput');
        const chatMessages = document.getElementById('chatMessages');

        function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Mensagem do Utilizador
            appendMessage(text, 'user');
            userInput.value = '';

            // Resposta Simulada do AIFilipe
            setTimeout(() => {
                appendMessage('Comando recebido. Como posso ajudar mais?', 'ai');
            }, 600);
        }

        function appendMessage(text, sender) {
            const msgDiv = document.createElement('div');
            msgDiv.style.margin = '10px 0';
            msgDiv.style.padding = '10px 14px';
            msgDiv.style.borderRadius = '18px';
            msgDiv.style.maxWidth = '75%';
            msgDiv.style.wordBreak = 'break-word';
            msgDiv.style.fontSize = '0.95rem';

            if (sender === 'user') {
                msgDiv.style.backgroundColor = '#007bff';
                msgDiv.style.color = 'white';
                msgDiv.style.marginLeft = 'auto';
            } else {
                msgDiv.style.backgroundColor = '#e4e6eb';
                msgDiv.style.color = '#333';
                msgDiv.style.marginRight = 'auto';
            }

            msgDiv.textContent = text;
            chatMessages.appendChild(msgDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>

</body>
</html>
